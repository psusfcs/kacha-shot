name: 自动编译 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ★ 固定签名密钥。
      #   为什么必须固定：云 runner 每次都重建 ~/.android/debug.keystore，
      #   导致每版 APK 签名不同 → 覆盖安装报「应用未安装」→ 用户得先卸载再装（数据全丢）。
      #   存成 base64 放 Secret，这里还原成 keystore.p12 给 Gradle 用。
      #   跟「全局AI助手」共用同一套密钥 —— 两个 App 包名不同，互不影响。
      - name: 准备签名密钥
        run: |
          echo "${{ secrets.SIGNING_KEY_B64 }}" | base64 -d > keystore.p12
          ls -l keystore.p12

      # 直接用 Action 装好的 gradle 8.9，不依赖仓库里的 gradle-wrapper.jar（二进制不好传）
      - name: 编译 Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PKS_STOREPASS="${{ secrets.KS_STOREPASS }}" \
            -PKS_ALIAS="${{ secrets.KS_ALIAS }}" \
            -PKS_KEYPASS="${{ secrets.KS_KEYPASS }}"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: kacha-shot-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 顺手发 Release：commit 以 release: 开头才发。
      # tag = v版本名，正文第一行写「版本码: N」。
      - name: 发布 Release
        if: startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          MSG="${{ github.event.head_commit.message }}"
          VER=$(echo "$MSG" | sed -n 's/.*release: *v\{0,1\}\([0-9][0-9.]*\).*/\1/p' | head -1)
          if [ -z "$VER" ]; then VER="dev-$(date +%Y%m%d%H%M)"; fi
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "kacha-shot-v${VER}.apk"
          printf '版本码: %s\n\n本版更新：%s\n' "$CODE" "$MSG" > notes.txt
          gh release create "v${VER}" \
            --repo "${{ github.repository }}" \
            --title "v${VER}" \
            --notes-file notes.txt \
            "kacha-shot-v${VER}.apk" || \
          gh release upload "v${VER}" "kacha-shot-v${VER}.apk" --clobber
